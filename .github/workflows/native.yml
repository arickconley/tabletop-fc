name: Native game checks

on:
  push:
    branches: [main]
    paths: ['godot/**', 'scripts/test-native.py', '.github/workflows/native.yml', 'src/game.js', 'godot/tests/reference.mjs']
  pull_request:
    paths: ['godot/**', 'scripts/test-native.py', '.github/workflows/native.yml', 'src/game.js', 'godot/tests/reference.mjs']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import assets
        env:
          GODOT_MCP_RUNTIME: '0'
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot --import
      - name: Rules and native regression checks
        env:
          GODOT_BIN: Godot_v4.7.2-stable_linux.x86_64
        run: python3 scripts/test-native.py
